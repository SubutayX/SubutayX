name: Generate City

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate City SVG
        uses: Anurag-Bharati/github-city@v1
        with:
          GITHUB_USER: SubutayX
          GITHUB_TOKEN: ${{ secrets.PAT }}
          BRANCH: city-output
