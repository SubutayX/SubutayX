name: Generate Snake & Pacman

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake & Pacman SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: SubutayX
          github_token: ${{ secrets.PAT }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#4ECDC4
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF6B6B&color_dots=#161b22,#0e4429,#26a641,#39d353,#26a641
            dist/github-contribution-grid-pacman.svg?snake=pacman&palette=github-dark&color_snake=#4ECDC4
            dist/github-contribution-grid-pacman-dark.svg?snake=pacman&palette=github-dark&color_snake=#FF6B6B&color_dots=#161b22,#0e4429,#26a641,#39d353,#26a641

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
